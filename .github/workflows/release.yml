name: Draft release
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact default-branch commit (40 hex characters)
        required: true
        type: string
permissions: {}
concurrency:
  group: covearchive-v1.0.0-draft
  cancel-in-progress: false
env:
  PYTHON_VERSION: 3.12.10
  INNO_VERSION: 6.7.1
  # SHA-256 digests of the pinned release assets, from the GitHub release API.
  APPIMAGETOOL_VERSION: 1.9.1
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  APPIMAGE_RUNTIME_VERSION: '20251108'
  APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python packaging/preflight.py
  build-windows:
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - shell: pwsh
        id: build
        run: |
          python -m pip install --require-hashes --no-deps -r packaging/requirements-build.txt
          if ($LASTEXITCODE) { throw 'Locked install failed' }
          & packaging/windows_ci.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist/release/*.exe
            dist/release/windows.sha256
          if-no-files-found: error
  build-linux:
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - shell: bash
        id: build
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb desktop-file-utils libdbus-1-3 libgl1 libegl1 libopengl0 libfontconfig1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xinput0 libxcb-xkb1 libwayland-client0 libwayland-cursor0 libwayland-egl1
          python -m pip install --require-hashes --no-deps -r packaging/requirements-build.txt
          bash packaging/linux/ci.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            dist/release/*.AppImage
            dist/release/*.deb
            dist/release/linux.sha256
          if-no-files-found: error
  draft:
    # gh is supplied and maintained by the GitHub runner image.
    needs: [build-windows, build-linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/release
          merge-multiple: true
      - shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_SHA256: ${{ needs.build-windows.outputs.sha256 }}
          LINUX_SHA256: ${{ needs.build-linux.outputs.sha256 }}
        run: |
          set -euo pipefail
          python packaging/draft_release.py dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: draft-receipt
          path: dist/release-receipt.json
          if-no-files-found: error
